{% extends 'base.html' %}

{% block title %}Editar Perfil{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-header">
                    <h4 class="mb-0"><span class="mdi mdi-account-edit-outline me-2"></span>Editar Perfil</h4>
                </div>
                <div class="card-body p-4">
                    <form method="POST" action="{{ url_for('editar_perfil') }}">
                        
                        <h5 class="form-section-title">Informações Pessoais e de Contacto</h5>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="nome_completo" class="form-label">Nome Completo</label>
                                <input type="text" class="form-control" id="nome_completo" name="nome_completo" value="{{ user.nome_completo }}" required>
                            </div>
                             <div class="col-md-6 mb-3">
                                <label for="telefone" class="form-label">Telefone (com DDD)</label>
                                <input type="tel" class="form-control" id="telefone" name="telefone" value="{{ user.telefone or '' }}">
                            </div>
                        </div>

                        <h5 class="form-section-title mt-4">Informações da Empresa</h5>
                         <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="empresa" class="form-label">Empresa</label>
                                <input type="text" class="form-control" id="empresa" name="empresa" value="{{ user.empresa or '' }}">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="ramo_atividade" class="form-label">Ramo de Atividade</label>
                                <input type="text" class="form-control" id="ramo_atividade" name="ramo_atividade" value="{{ user.ramo_atividade or '' }}">
                            </div>
                        </div>

                        <h5 class="form-section-title mt-4">Marketplaces Utilizados</h5>
                        <div class="form-group mb-3">
                            {% set marketplaces = user.marketplaces.split(',') if user.marketplaces else [] %}
                            <div class="d-flex flex-wrap">
                                <div class="form-check me-3 mb-2"><input class="form-check-input" type="checkbox" name="marketplaces" value="Mercado Livre" id="checkML" {% if 'Mercado Livre' in marketplaces %}checked{% endif %}><label class="form-check-label" for="checkML">Mercado Livre</label></div>
                                <div class="form-check me-3 mb-2"><input class="form-check-input" type="checkbox" name="marketplaces" value="Shopee" id="checkShopee" {% if 'Shopee' in marketplaces %}checked{% endif %}><label class="form-check-label" for="checkShopee">Shopee</label></div>
                                <div class="form-check me-3 mb-2"><input class="form-check-input" type="checkbox" name="marketplaces" value="Magalu" id="checkMagalu" {% if 'Magalu' in marketplaces %}checked{% endif %}><label class="form-check-label" for="checkMagalu">Magazine Luiza</label></div>
                                <div class="form-check me-3 mb-2"><input class="form-check-input" type="checkbox" name="marketplaces" value="Amazon" id="checkAmazon" {% if 'Amazon' in marketplaces %}checked{% endif %}><label class="form-check-label" for="checkAmazon">Amazon</label></div>
                                <div class="form-check mb-2"><input class="form-check-input" type="checkbox" name="marketplaces" value="Outro" id="checkOutro" {% if 'Outro' in marketplaces %}checked{% endif %}><label class="form-check-label" for="checkOutro">Outro</label></div>
                            </div>
                        </div>

                        <hr class="my-4">

                        <div class="d-flex justify-content-end">
                            <a href="{{ url_for('perfil') }}" class="btn btn-secondary me-2">Cancelar</a>
                            <button type="submit" class="btn btn-primary"><span class="mdi mdi-content-save me-1"></span>Salvar Alterações</button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
