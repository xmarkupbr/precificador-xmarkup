{% extends "base.html" %}

{% block title %}Criar Conta{% endblock %}

{% block content %}
<form method="POST" action="{{ url_for('register') }}">
    
    <div class="form-group mb-3">
        <label for="nome_completo">Nome Completo</label>
        <input type="text" class="form-control" id="nome_completo" name="nome_completo" required>
    </div>

    <div class="form-group mb-3">
        <label for="empresa">Empresa</label>
        <input type="text" class="form-control" id="empresa" name="empresa">
    </div>

    <div class="form-group mb-3">
        <label for="telefone">Telefone (com DDD)</label>
        <input type="tel" class="form-control" id="telefone" name="telefone">
    </div>

    <div class="form-group mb-3">
        <label for="ramo_atividade">Ramo de Atividade</label>
        <input type="text" class="form-control" id="ramo_atividade" name="ramo_atividade">
    </div>

    <div class="form-group mb-3">
        <label>Quais Marketplaces você utiliza?</label>
        <div class="form-check">
            <input class="form-check-input" type="checkbox" name="marketplaces" value="Mercado Livre" id="checkML">
            <label class="form-check-label" for="checkML">Mercado Livre</label>
        </div>
        <div class="form-check">
            <input class="form-check-input" type="checkbox" name="marketplaces" value="Shopee" id="checkShopee">
            <label class="form-check-label" for="checkShopee">Shopee</label>
        </div>
        <div class="form-check">
            <input class="form-check-input" type="checkbox" name="marketplaces" value="Magalu" id="checkMagalu">
            <label class="form-check-label" for="checkMagalu">Magazine Luiza</label>
        </div>
        <div class="form-check">
            <input class="form-check-input" type="checkbox" name="marketplaces" value="Amazon" id="checkAmazon">
            <label class="form-check-label" for="checkAmazon">Amazon</label>
        </div>
        <div class="form-check">
            <input class="form-check-input" type="checkbox" name="marketplaces" value="Outro" id="checkOutro">
            <label class="form-check-label" for="checkOutro">Outro</label>
        </div>
    </div>

    <hr>

    <div class="form-group mb-3">
        <label for="email">E-mail</label>
        <input type="email" class="form-control" id="email" name="email" required>
    </div>

    <div class="form-group mb-3">
        <label for="password">Senha</label>
        <input type="password" class="form-control" id="password" name="password" required>
    </div>

    <div class="d-grid gap-2">
        <button type="submit" class="btn btn-primary">Criar Conta</button>
    </div>

</form>
{% endblock %}
